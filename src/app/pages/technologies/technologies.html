<div class="tech-page">

  <!-- Header -->
  <section class="hero">
    <h1>Technologies We Use</h1>
    <p>Modern stack powering scalable enterprise solutions</p>
  </section>

  <!-- Search + Filters Bar -->
  <section class="toolbar">

    <input
      type="text"
      placeholder="Search technology..."
      [(ngModel)]="searchText"
      class="search-box"
    />

    <div class="filters">

      <button (click)="setCategory('All')"
        [class.active]="selectedCategory === 'All'">
        All
      </button>

      <button (click)="setCategory('Frontend')"
        [class.active]="selectedCategory === 'Frontend'">
        Frontend
      </button>

      <button (click)="setCategory('Backend')"
        [class.active]="selectedCategory === 'Backend'">
        Backend
      </button>

      <button (click)="setCategory('Cloud')"
        [class.active]="selectedCategory === 'Cloud'">
        Cloud
      </button>

    </div>

  </section>

  <!-- Result Info -->
  <div class="result-info">
    Showing {{ filteredTechnologies.length }} technologies
  </div>

  <!-- Grid -->
  <section class="grid">

    <div class="card" *ngFor="let tech of filteredTechnologies">

      <img [src]="tech.logo" [alt]="tech.name" />

      <h3>{{ tech.name }}</h3>

      <span class="badge">{{ tech.category }}</span>

      <p>{{ tech.description }}</p>

    </div>

  </section>

  <!-- Empty State -->
  <div class="empty" *ngIf="filteredTechnologies.length === 0">
    No technologies found 😕
  </div>

</div>
