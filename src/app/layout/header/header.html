<header class="header-shell">
  <nav class="navbar glass-card" aria-label="Primary">
    <a class="brand" routerLink="/" aria-label="Innovance Techlabs home">
      <img
        ngSrc="assets/images/logo.png"
        width="220"
        height="80"
        priority
        class="brand-logo"
        alt="Innovance Techlabs"
      />
      <span class="brand-copy">
        <strong>Innovance Techlabs</strong>
        <span>Software, cloud and AI delivery</span>

    <ul class="nav-links" aria-label="Main navigation">

        <a routerLink="/">Home</a>

        <a routerLink="/about">About</a>
      </li>
      <li routerLinkActive="active">
        <a routerLink="/services">Services</a>
      </li>
      <li routerLinkActive="active">
        <a routerLink="/technologies">Technologies</a>
      </li>
      <li routerLinkActive="active">
        <a routerLink="/portfolio">Portfolio</a>
      </li>
      <li routerLinkActive="active">
        <a routerLink="/contact">Contact</a>
      </li>
    </ul>

    <a class="cta-button nav-cta" routerLink="/contact">Book a consultation</a>
